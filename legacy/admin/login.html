<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | المركز التخصصي لطب وزراعة الاسنان</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>

  <div class="login-wrapper">
    <div class="glass-card login-card">

      <!-- Top controls -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <button id="theme-toggle-btn" class="btn-icon-toggle">
          <span>🌙</span>
          <span id="theme-btn-text">الوضع الفاتح</span>
        </button>
        <button id="lang-toggle-btn" class="btn-icon-toggle">
          🌐 <span data-i18n="langSwitch">English</span>
        </button>
      </div>

      <!-- Brand header -->
      <div class="brand-logo"
        style="justify-content:center; flex-direction:column; text-align:center; margin-bottom:2rem;">
        <div class="logo-icon" style="width:70px; height:70px; margin-bottom:0.75rem;">
          <img src="../images/logo.png" alt="المركز التخصصي لطب وزراعة الاسنان" class="brand-logo-img">
        </div>
        <h2
          style="font-size:1.5rem; font-weight:800; background:var(--accent-gradient); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;">
          تسجيل دخول لوحة التحكم
        </h2>
        <p style="font-size:0.85rem; color:var(--text-muted);">المركز التخصصي لطب وزراعة الاسنان - إدارة الملفات</p>
      </div>

      <!-- Login Form -->
      <form id="admin-login-form">
        <div class="form-group" style="margin-bottom:1.25rem;">
          <label for="username">اسم المستخدم</label>
          <div class="input-wrapper">
            <input type="text" id="username" class="form-control no-icon" placeholder="اسم المستخدم" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:1.75rem;">
          <label for="password">كلمة المرور</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control no-icon" placeholder="كلمة المرور" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          🔑 دخول النظام
        </button>
      </form>

      <div style="margin-top:1.5rem; text-align:center;">
        <a href="../index.html" style="font-size:0.85rem; color:var(--text-muted);">← العودة لصفحة تسجيل المريض</a>
      </div>

    </div>
  </div>

  <script src="../js/script.js"></script>
</body>

</html>
